name: calorie_snap
description: 拍照识别食物热量并结合身高体重给出健康建议的 App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 拍照 / 选图
  image_picker: ^1.0.7
  # 网络请求(调用大模型视觉 API)
  http: ^1.2.0
  # 本地持久化
  shared_preferences: ^2.2.2
  # 状态管理
  provider: ^6.1.1
  # 时间格式化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true